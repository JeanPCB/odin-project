<!DOCTYPE html>

<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Links and images HTML</title>
</head>

<body>
   <h1>Homepage</h1>
   <!-- Open same page  -->
   <!-- target=_self -->
   <p>
      <a href="https://www.theodinproject.com/about" >About The Odin Project</a>
   </p>

   <!-- Open new page -->
   <p>
      <a href="https://www.theodinproject.com/about" target="_blank" rel="noopener noreferrer">About The Odin Project</a>
   </p>

   <p>
      <a href="pages/about.html">About</a>
   </p>

   <h2>Images</h2>
   <p>Absolute Image</p>
   <img src="https://www.theodinproject.com/mstile-310x310.png" alt="The Odin Project logo" height="310" width="310">

   <p>Relative Image</p>
   <img src="images/dog.jpg" alt="a black pug wearing pet's clothes" height="200" width="200">

   <h2>HTML Entities</h2>
   <ul>
      <li>Less than: &lt;</li>
      <li>Greater than: &gt;</li>
      <li>Ampersand: &amp;</li>
   </ul>

   <h2>Quotes</h2>
   <ul>
      <li>&ldquo;</li>
      <li>&rdquo;</li>
      <li>&lsquo;</li>
      <li>&rsquo;</li>
   </ul>
</body>
</html>
